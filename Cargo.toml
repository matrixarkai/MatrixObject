[package]
name = "matrixobjectstore-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
# The description is published verbatim on a package index, so it says what the
# crate is in one line and uses the tier names the code uses. It said "segment
# GC accounting" until 2026-10-19; segment is a retired name for a chunk.
description = "Apache-2.0 distributed object store in Rust: object semantics, chunk and page tiers, quorum replication, and a footprint audit that names every resident byte"
repository = "https://github.com/matrixarkai/MatrixObject"
homepage = "https://github.com/matrixarkai/MatrixObject"
documentation = "https://docs.rs/matrixobjectstore-rs"
readme = "README.md"
keywords = ["object-store", "storage", "s3", "distributed", "replication"]
categories = ["database-implementations", "filesystem"]
exclude = ["pages/", "scratchpad/", "target/"]

[features]
default = ["raft-rs"]
raft-rs = ["dep:raft"]
# The HTTP front door (`src/net`, and the `object_server` binary).
#
# Off by default, and it adds NO dependencies -- it is written on the standard library alone, for
# the reason given at the top of `src/net/http.rs`. What the feature gates is the listener and its
# thread pool: a crate linked for its object semantics should not grow either unasked.
http-server = []
matrix-raft = ["dep:matrixraft"]

[dependencies]
raft = { version = "0.7", optional = true, default-features = false, features = ["prost-codec"] }
matrixraft = { git = "https://github.com/matrixarkai/matrixraft.git", optional = true }
