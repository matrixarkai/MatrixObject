[package]
name = "matrixobjectstore-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
# The description is published verbatim on a package index, so it says what the
# crate is in one line and uses the tier names the code uses. It said "segment
# GC accounting" until 2026-10-19; segment is a retired name for a chunk.
description = "Apache-2.0 distributed object store in Rust: object semantics, chunk and page tiers, quorum replication, and a footprint audit that names every resident byte"
repository = "https://github.com/matrixarkai/MatrixObject"
homepage = "https://github.com/matrixarkai/MatrixObject"
documentation = "https://docs.rs/matrixobjectstore-rs"
readme = "README.md"
keywords = ["object-store", "storage", "s3", "distributed", "replication"]
categories = ["database-implementations", "filesystem"]
exclude = ["pages/", "scratchpad/", "target/"]

[features]
default = ["raft-rs", "http-server", "replica-server", "meta-server"]
raft-rs = ["dep:raft"]
# The S3-compatible HTTP front door (`src/net`, and the `object_server` binary).
#
# ON by default, and it adds NO dependencies -- it is written on the standard library alone, for
# the reason given at the top of `src/net/http.rs`. What the feature gates is the listener and its
# thread pool, which cost nothing until something binds a port.
#
# It was off by default while it was an in-house HTTP shape nobody could point a client at. It
# speaks S3 now, so the default is the other way round: a store that answers `ListObjectsV2` and
# `<Error>` documents is reachable by every S3 client already installed, and a feature flag
# standing between that and a new user is a barrier with nothing behind it.
http-server = []
# `s3` is the same surface under the name people look for. It gates nothing of its own: the wire
# format is not separable from the routing -- there is no HTTP mode of this server that answers
# anything other than S3 -- so this is an alias and is documented as one rather than implying a
# choice that does not exist.
s3 = ["http-server"]
# Replicas in other processes (`src/cluster`, and the `chunkserver` binary).
#
# ON by default. The fs2 dependency provides the exclusive durable-journal file lock.
# What the feature gates is a listener, a client and the quorum
# over them, none of which costs anything until something binds a port: the default
# `ReplicaPlacement` is the in-process arrangement this store has always had, so a build with
# this feature on behaves exactly as it did before something asks for remote replicas.
#
# On by default rather than opt-in because the thing it makes possible -- surviving the loss
# of one replica process -- is what the replication factor this store already pays for is
# supposed to buy. A flag standing between a user and that is a barrier in front of the point.
replica-server = ["dep:fs2", "dep:libc"]
# The control plane in another process (`src/cluster`'s metaserver half, and the `metaserver`
# binary).
#
# ON by default. It reuses the replica framing and the fs2 storage-lock dependency. What the feature gates is a
# listener, a client and the directory over them, none of which costs anything until something
# binds a port: an empty `metaserver_catalog_endpoints` is the in-process control plane this
# store has always had, so a build with this feature on behaves exactly as it did before
# something names an endpoint.
meta-server = ["dep:fs2", "dep:libc"]
matrix-raft = ["dep:matrixraft"]
chunk-consensus = ["replica-server", "matrix-raft", "matrixraft/peer-runtime"]
metadata-consensus = ["meta-server", "matrix-raft", "matrixraft/peer-runtime"]

api-tls = ["peer-tls"]
peer-tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
prost = "0.11.9"
fs2 = { version = "0.4.3", optional = true }
raft = { version = "0.7", optional = true, default-features = false, features = ["prost-codec"] }
matrixraft = { git = "https://github.com/matrixarkai/matrixraft.git", rev = "2b506a879a8d543fa28f5779a140708819f1bdd0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
