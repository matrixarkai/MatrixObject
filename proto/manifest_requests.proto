syntax = "proto3";
package matrixobject.request.v1;
import "object_manifest.proto";
// Metadata request codes 75 and 76. Existing node framing bounds the payload.
// Successful replies are canonical matrixobject.ObjectManifest messages.
message ManifestRead {
  uint32 version = 1; // 1
  string bucket = 2;
  string key = 3;
}
message ManifestPublish {
  uint32 version = 1; // 1
  matrixobject.ManifestOutcome outcome = 2;
  uint64 update_time_ms = 3;
}

// Metadata request code 77. Reply: matrixobject.ObjectPageAllocation.
message AllocateObjectPages {
  uint32 version = 1; // 1
  uint32 page_count = 2; // 1..4096
}
