syntax = "proto3";
package matrixobject;
message ImmutablePage {
  uint64 page_index = 1;
  uint64 length = 2;
  uint64 write_sequence = 3;
  bytes sha256 = 4;
}
message NamespaceFence {
  uint32 version = 1;
  uint64 volume_id = 2;
  uint64 chunk_id = 3;
  uint64 generation = 4;
  repeated ImmutablePage pages = 5;
}
message NamespaceFenceOutcome {
  uint32 version = 1;
  uint64 before_generation = 2;
  NamespaceFence after = 3;
}
message NamespaceFenceQuery {
  uint32 version = 1;
  uint64 volume_id = 2;
  uint64 chunk_id = 3;
}
message NamespaceFenceCatalog {
  uint32 version = 1;
  repeated NamespaceFence fences = 2;
}
