syntax = "proto3";
package matrixobject;
import "object_manifest.proto";

// Metadata opcode 92. Permanent handles require release; sessions have bounded deadlines.
message ManifestRetentionRequest {
  uint32 version = 1;
  uint32 action = 2; // 1 retain, 2 release, 3 read, 4 list; version 2: 5 open session, 6 renew, 7 expire; version 3: 8 grant selected manifest
  string bucket = 3;
  string key = 4;
  uint64 generation = 5;
  uint64 retention_id = 6; // exclusive cursor for list
  uint32 limit = 7;
  uint64 ttl_ms = 8;
  uint64 expected_expiry_ms = 9;
  bytes manifest_sha256 = 10; // version 3 action 8: exact selected manifest
}
message ManifestRetentionReply {
  uint32 version = 1;
  RetainedManifest retained = 2;
  repeated uint64 retention_ids = 3;
  bool has_more = 4;
  uint64 retention_id = 5; // version 2 renewal or version 4 selected grant reply
  uint64 expires_at_ms = 6;
  uint64 lease_ms = 7; // version 3 full record or version 4 selected grant
  bytes manifest_sha256 = 8; // version 4 selected grant acknowledgement
}
message ManifestRetentionChange {
  RetainedManifest before = 1;
  RetainedManifest after = 2;
}
message RetentionDeadlineChange {
  uint64 retention_id = 1;
  uint64 before = 2;
  uint64 after = 3;
}
message ReadSessionOpen {
  uint64 retention_id = 1;
  string bucket = 2;
  string key = 3;
  uint64 generation = 4;
  uint64 expires_at_ms = 5;
  bytes manifest_sha256 = 6;
}
message ReadSessionRemoval {
  uint64 retention_id = 1;
  uint64 expected_expiry_ms = 2;
}
