syntax = "proto3";
package matrixobject.conditional;
// Replica request code 8. Zero expected_sequence requires an absent page.
message ChunkWrite {
  uint32 version = 1;
  uint64 volume = 2;
  uint64 chunk = 3;
  uint64 page = 4;
  uint64 offset = 5;
  uint64 expected_sequence = 6;
  bytes data = 7;
}
// Replica request codes 14 and 16. Up to eight writes totaling four MiB.
// Code 16 returns ChunkDigestBatch.
message ChunkWriteBatch {
  uint32 version = 1;
  repeated ChunkWrite writes = 2;
}
message ChunkDigest {
  uint32 version = 1;
  uint64 write_sequence = 2;
  uint64 length = 3;
  bytes sha256 = 4;
}
message ChunkDigestBatch {
  uint32 version = 1;
  repeated ChunkDigest digests = 2;
}
// Replica request code 17. The reply is ChunkReadBatchResult.
message ChunkRead {
  uint32 version = 1;
  uint64 volume = 2;
  uint64 chunk = 3;
  uint64 page = 4;
  uint64 offset = 5;
  uint64 length = 6;
}
message ChunkReadBatch {
  uint32 version = 1;
  repeated ChunkRead reads = 2;
}
message ChunkReadResult {
  uint32 version = 1;
  uint64 write_sequence = 2;
  string checksum = 3;
  bytes data = 4;
}
message ChunkReadBatchResult {
  uint32 version = 1;
  repeated ChunkReadResult reads = 2;
}
// Replica request code 18. The ordered reply carries explicit absent entries.
message ChunkPage {
  uint32 version = 1;
  uint64 volume = 2;
  uint64 chunk = 3;
  uint64 page = 4;
}
message ChunkHeadBatch {
  uint32 version = 1;
  repeated ChunkPage pages = 2;
}
message ChunkRange {
  uint64 offset = 1;
  uint64 length = 2;
}
message ChunkHead {
  uint32 version = 1;
  bool present = 2;
  uint64 logical_length = 3;
  uint64 write_sequence = 4;
  string checksum = 5;
  string state_checksum = 6;
  repeated ChunkRange discarded_ranges = 7;
}
message ChunkHeadBatchResult {
  uint32 version = 1;
  repeated ChunkHead heads = 2;
}
message Placement {
  string bucket = 1;
  string key = 2;
  uint64 version = 3;
  uint64 length = 4;
  repeated string nodes = 5;
  uint64 updated = 6;
}
// Metadata request code 73. An absent expected field requires no placement.
message PlacementCommit {
  uint32 version = 1;
  Placement placement = 2;
  Placement expected = 3;
  string plan_checksum = 4;
}

// Replica request code 9. Requires a positive existing page sequence.
message ChunkDiscard {
  uint32 version = 1;
  uint64 volume = 2;
  uint64 chunk = 3;
  uint64 page = 4;
  uint64 offset = 5;
  uint64 expected_sequence = 6;
  uint64 length = 7;
}
