syntax = "proto3";
package matrixobject;
import "object_manifest.proto";

message StagedAllocationChange {
  StagedAllocation before = 1;
  StagedAllocation after = 2;
}
// Metadata opcode 93. Allocation protects a fresh page namespace before data I/O.
message StagedAllocationRequest {
  uint32 version = 1;
  uint32 action = 2; // 1 allocate, 2 read, 3 abort, 4 publish, 5 list, 6 fence, 7 read fence
  uint64 allocation_id = 3;
  uint32 page_count = 4;
  string bucket = 5;
  string key = 6;
  uint64 expected_generation = 7;
  bool append = 8;
  ManifestOutcome outcome = 9;
  uint64 update_time_ms = 10;
  uint32 limit = 11;
}
message StagedAllocationReply {
  uint32 version = 1;
  StagedAllocation allocation = 2;
  ObjectManifest manifest = 3;
  repeated uint64 allocation_ids = 4;
  bool has_more = 5;
  uint64 publication_fence = 6;
}
message PublicationFenceChange {
  uint64 before = 1;
  uint64 after = 2;
}
