blank_issues_enabled: true
contact_links:
  - name: Security or durability report
    url: https://github.com/matrixarkai/MatrixObject/security/advisories/new
    about: >-
      Report privately instead of opening an issue. In a store that acknowledges writes, a
      durability defect -- an acknowledged write that is not durable, a read that does not
      reconstruct, a receipt attesting to a write that did not happen -- is handled as a
      vulnerability. See SECURITY.md.
