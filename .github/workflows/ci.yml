            tests::a_shared_allocation_is_charged_for_its_header -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: One bucket name serves the whole bucket
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::every_object_in_a_bucket_names_it_through_one_allocation -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: Attributes cost one pointer when absent
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_object_without_attributes_pays_one_pointer_for_them -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A storage class costs no heap at all
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_storage_class_costs_no_heap_at_all -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The storage class variants are the valid names
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_storage_class_variants_are_the_valid_names -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An extent list carries no spare capacity
        run: |
