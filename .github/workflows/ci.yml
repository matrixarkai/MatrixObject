name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, so "it builds" means the same thing here and locally, and so
      # that denying warnings below cannot be broken by a compiler release
      # nobody in this repository chose.
      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build everything, warnings denied
        run: cargo build --all-targets --locked
        env:
          RUSTFLAGS: "-D warnings"

      # EVERY FEATURE, AND THIS IS NOT BELT-AND-BRACES. `net` -- the entire HTTP
      # surface, its wire format and its tests -- sits behind `http-server`, so
      # the step above never compiles a line of it. Two changes reached main with
      # the feature build broken before this step existed, each passing a green
      # check: the default build cannot see a feature-gated module at all, and
      # neither can `--all-targets`.
      - name: Build everything with every feature, warnings denied
        run: cargo build --all-targets --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Same reason, and it found two unresolved intra-doc links that had been in
      # `net` since it was written: a module nothing documents cannot have its
      # links checked.
      - name: Docs with every feature
        run: cargo doc --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  guards:
    name: format and rollback guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Each guard asserts that it actually RAN. `cargo test` reports success
      # when a filter matches nothing, so a step checking only the exit status
      # passes while testing nothing -- and `--exact` needs the full `tests::`
      # path or it matches nothing at all.
      - name: Durable format constants are unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::every_durable_format_constant_is_accounted_for -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A refused mutation leaves the store unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_put_that_fails_after_mutating_leaves_the_store_unchanged -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An upload in progress is counted
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_audit_counts_bytes_held_by_an_unfinished_multipart_upload -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The metadata service is counted
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_audit_counts_what_the_metadata_service_holds -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The holders of one object key share it
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_holders_that_name_one_object_share_its_key_characters -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The metadata record key is one allocation
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_metadata_record_key_is_one_allocation_across_its_holders -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A shared allocation is charged for its header
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_shared_allocation_is_charged_for_its_header -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: One bucket name serves the whole bucket
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::every_object_in_a_bucket_names_it_through_one_allocation -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: Attributes cost one pointer when absent
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_object_without_attributes_pays_one_pointer_for_them -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A storage class costs no heap at all
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_storage_class_costs_no_heap_at_all -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The storage class variants are the valid names
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_storage_class_variants_are_the_valid_names -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An extent list carries no spare capacity
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_extent_list_carries_no_spare_capacity -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An object under no lock pays one pointer
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_object_under_no_lock_pays_one_pointer_for_it -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: One content type, one allocation
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::objects_of_one_content_type_name_it_through_one_allocation -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: Past the bound an object owns its content type
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::past_the_bound_an_object_owns_its_content_type -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The read cache is in the byte headline
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_read_cache_is_in_the_byte_headline -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The receipt maps are counted in bytes
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_receipt_maps_are_counted_in_bytes -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The undo a mutation holds is accounted to the byte
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_undo_a_mutation_holds_is_accounted_to_the_byte -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: What a put undoes by hand does not grow with the store
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::what_a_put_undoes_by_hand_does_not_grow_with_the_store -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A retained idempotency key carries no slack
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_retained_idempotency_key_carries_no_slack -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A stale range holds no payload entry
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_stale_range_holds_no_payload_entry -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An append that fails after mutating leaves the store unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_append_that_fails_after_mutating_leaves_the_store_unchanged -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A refused put leaves an upload in flight intact
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_refused_put_leaves_an_upload_in_flight_intact -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: An upload in flight is not copied by an unrelated mutation
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::an_upload_in_flight_is_not_copied_by_an_unrelated_mutation -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A copy that fails after mutating leaves the store unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_copy_that_fails_after_mutating_leaves_the_store_unchanged -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      # RENAMED WITH ITS TEST, AND THE NAME MATTERS AS MUCH AS THE FILTER. This step asked for
      # `the_snapshot_a_mutation_holds_shares_payload_rather_than_copying_it`, which #87 renamed
      # when it found the old claim was its fixture's rather than a law -- and #87 did not update
      # this guard, so every run since has failed with "the guard did not run" and main has been
      # red on this job. Repointing the filter alone would have left a step whose NAME asserts the
      # claim that was refuted, which is worse than a red: a green step carrying the old sentence
      # reads as passing evidence for it.
      #
      # What the test actually pins, in both halves: a chunk's payload is an `Arc<Vec<u8>>`, so the
      # snapshot NAMES the stored bytes rather than duplicating them; and what it copies is the
      # structure around them, per CHUNK, at a cost per chunk the test asserts is constant.
      - name: The snapshot a mutation holds names the payload and copies a constant per chunk
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_snapshot_a_mutation_holds_copies_a_fixed_cost_for_every_chunk -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: A refused mutation leaves exactly the receipts it found
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_refused_mutation_leaves_exactly_the_receipts_it_found -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The MatrixRaft state machine builds and its tests pass
        run: |
          set -o pipefail
          cargo build --lib --features matrix-raft
          cargo test --lib --features matrix-raft \
            tests::a_metadata_snapshot_crosses_a_raft_state_machine_intact -- --exact \
            | tee /tmp/matrixraft.log
          grep -q '^test result: ok. 1 passed' /tmp/matrixraft.log \
            || { echo "::error::a_metadata_snapshot_crosses_a_raft_state_machine_intact did not run"; exit 1; }
          cargo test --lib --features matrix-raft \
            tests::a_snapshot_chunk_at_the_wrong_offset_is_refused -- --exact \
            | tee /tmp/matrixraft.log
          grep -q '^test result: ok. 1 passed' /tmp/matrixraft.log \
            || { echo "::error::a_snapshot_chunk_at_the_wrong_offset_is_refused did not run"; exit 1; }
          cargo test --lib --features matrix-raft \
            tests::applying_an_entry_reports_the_codec_the_log_format_would_need -- --exact \
            | tee /tmp/matrixraft.log
          grep -q '^test result: ok. 1 passed' /tmp/matrixraft.log \
            || { echo "::error::applying_an_entry_reports_the_codec_the_log_format_would_need did not run"; exit 1; }

      - name: Every Rust source carries the licence header
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::every_rust_source_carries_the_licence_header -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::every_rust_source_carries_the_licence_header did not run"; exit 1; }

      - name: The README describes the CI it has
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_readme_describes_the_continuous_integration_it_has -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_readme_describes_the_continuous_integration_it_has did not run"; exit 1; }

      - name: The repository carries what an outside contributor needs
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_repository_carries_what_an_outside_contributor_needs -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_repository_carries_what_an_outside_contributor_needs did not run"; exit 1; }

      - name: A returning replica does not vote until it is checked in
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_returning_replica_does_not_vote_until_it_is_checked_in -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_returning_replica_does_not_vote_until_it_is_checked_in did not run"; exit 1; }

      - name: The record of a stale replica is durable
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_authority_record_of_a_stale_replica_is_durable -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_authority_record_of_a_stale_replica_is_durable did not run"; exit 1; }

      - name: A multipart upload keeps its fences
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_multipart_upload_cannot_be_continued_or_destroyed_past_its_fences -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_multipart_upload_cannot_be_continued_or_destroyed_past_its_fences did not run"; exit 1; }

      - name: The idempotent multipart doors carry the same fences
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_idempotent_multipart_doors_carry_the_same_fences -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_idempotent_multipart_doors_carry_the_same_fences did not run"; exit 1; }

      - name: A prefix delete reports what a lease saved
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_prefix_delete_reports_the_object_a_lease_saved_rather_than_failing -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_prefix_delete_reports_the_object_a_lease_saved_rather_than_failing did not run"; exit 1; }

      - name: Compaction converges and gives the space back
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::compaction_converges_and_takes_the_space_ratio_back_to_one -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::compaction_converges_and_takes_the_space_ratio_back_to_one did not run"; exit 1; }

      - name: A retained version refuses the compaction of its chunk
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_retained_version_refuses_the_compaction_of_its_chunk -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_retained_version_refuses_the_compaction_of_its_chunk did not run"; exit 1; }

      - name: A write that fails part way did not happen
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_write_that_fails_part_way_through_its_pages_did_not_happen -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_write_that_fails_part_way_through_its_pages_did_not_happen did not run"; exit 1; }
