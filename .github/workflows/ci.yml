          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::filing_a_record_over_an_existing_key_replaces_it did not run"; exit 1; }

      - name: A digest equals the text it is a digest of and refuses a corrupt tag
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_digest_equals_the_text_it_is_a_digest_of_and_refuses_a_corrupt_tag -- --exact \
            | tee /tmp/guard.log
