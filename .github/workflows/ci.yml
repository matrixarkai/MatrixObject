name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, so "it builds" means the same thing here and locally, and so
      # that denying warnings below cannot be broken by a compiler release
      # nobody in this repository chose.
      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build everything, warnings denied
        run: cargo build --all-targets --locked
        env:
          RUSTFLAGS: "-D warnings"

      # EVERY FEATURE, AND THIS IS NOT BELT-AND-BRACES. `net` -- the entire HTTP
      # surface, its wire format and its tests -- sits behind `http-server`, so
      # the step above never compiles a line of it. Two changes reached main with
      # the feature build broken before this step existed, each passing a green
      # check: the default build cannot see a feature-gated module at all, and
      # neither can `--all-targets`.
      - name: Build everything with every feature, warnings denied
        run: cargo build --all-targets --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Same reason, and it found two unresolved intra-doc links that had been in
      # `net` since it was written: a module nothing documents cannot have its
      # links checked.
      - name: Docs with every feature
        run: cargo doc --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: gateway startup waits for metadata and respects its deadline
        run: |
          set -euo pipefail
          cargo test --locked --features metadata-consensus --test gateway_startup_metadata -- --test-threads=1 | tee /tmp/gateway-startup.log
          grep -q '^test result: ok. 3 passed; 0 failed;' /tmp/gateway-startup.log
        env:
          RUSTFLAGS: "-D warnings"

  # The client SDK is a crate of its own with its own lock file and no dependencies, so the root
  # build above never compiles it alone: it is reached there only as a dependency of the gateway.
  # This job builds and tests it exactly as someone who downloads it would, and packages it.
  client-sdk:
    name: cargo build / test / package (client SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/matrixobject-client
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: cargo build, warnings denied
        run: cargo build --locked
        env:
          RUSTFLAGS: "-D warnings"

      - name: unit tests
        run: |
          cargo test --locked --lib wire::tests
          cargo test --locked --lib client_tests::
          cargo test --locked --lib tcp_tests::
          set -o pipefail
          cargo test --locked --lib conditional_write_tests:: -- --test-threads=1 | tee /tmp/client-conditional.log
          grep -q 'test result: ok. 10 passed; 0 failed' /tmp/client-conditional.log

      - name: documentation, warnings denied
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo package (verify the published tarball builds)
        run: cargo package --locked

  guards:
    name: format and rollback guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool iproute2 iptables util-linux openssl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: The README describes the CI it has
        run: |
          set -o pipefail
          cargo test --locked --lib \
            repo_guard_tests::the_readme_describes_the_continuous_integration_it_has -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_readme_describes_the_continuous_integration_it_has did not run"; exit 1; }

      - name: Durable format constants are unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            repo_guard_tests::every_durable_format_constant_is_accounted_for -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the guard did not run"; exit 1; }

      - name: The repository carries what an outside contributor needs
        run: |
          set -o pipefail
          cargo test --locked --lib \
            repo_guard_tests::the_repository_carries_what_an_outside_contributor_needs -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_repository_carries_what_an_outside_contributor_needs did not run"; exit 1; }

      # Each guard asserts that it actually RAN. `cargo test` reports success
      # when a filter matches nothing, so a step checking only the exit status
      # passes while testing nothing -- and `--exact` needs the full `tests::`
      # path or it matches nothing at all.
      - name: Separate outcome application from Raft worker observations
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::consensus_inbox::progress_tests::outcome_observation_records_application_time_and_restores_raft_phase -- --exact | tee /tmp/outcome-observation.log
          grep -q 'test result: ok. 1 passed' /tmp/outcome-observation.log
      - name: Check catalog proposal batching and rollback
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::tests::catalog_batches -- --test-threads=1 | tee /tmp/catalog-batches.log
          grep -q 'test result: ok. 4 passed' /tmp/catalog-batches.log
      - name: Check bounded Star repair connections and retained scan progress
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --bin star_repaird | tee /tmp/repair-connections.log
          grep -q 'test result: ok. 1 passed' /tmp/repair-connections.log
          cargo test --locked --all-features --test network_metadata_consensus star_auto_repair::worker_discovers_two_star_groups_and_repairs_after_metadata_failover -- --exact | tee /tmp/repair-progress.log
          grep -q 'test result: ok. 1 passed' /tmp/repair-progress.log
      - name: Check verified membership controller refresh
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --test chunk_membership_controller -- --test-threads=1 | tee /tmp/membership-controller.log
          grep -q 'test result: ok. 3 passed' /tmp/membership-controller.log
      - name: Check committed chunk route validation
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::chunk_group_route::tests -- --test-threads=1 | tee /tmp/chunk-route.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' /tmp/chunk-route.log
      - name: Check routed chunk sockets and uncertain writes
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --test chunk_catalog_routing routed_catalog_ -- --test-threads=1 | tee /tmp/chunk-route.log
          grep -q 'test result: ok. 3 passed' /tmp/chunk-route.log
      - name: automatic fenced reports follow replacement and coupled restart
        run: |
          set -euo pipefail
          cargo test --locked --all-features --test network_chunk_consensus coupled_groups::fenced_heartbeats::automatic_fenced_reports_follow_chunk_replacement_and_coupled_restart -- --exact | tee /tmp/fenced-health.log
          grep -q '^running 1 test$' /tmp/fenced-health.log
          grep -q '^test result: ok. 1 passed' /tmp/fenced-health.log

      - name: chunk objects and the gateway features over Raft data groups
        run: |
          set -o pipefail
          cargo test --locked --all-features --test network_chunk_consensus chunk_objects_over_raft_groups_survive_leader_loss_races_appends_and_total_restart | tee /tmp/raft-chunk-objects.log
          grep -q '^test result: ok. 1 passed' /tmp/raft-chunk-objects.log
          cargo test --locked --all-features --test network_chunk_consensus the_gateway_features_run_over_raft_data_groups_and_survive_leader_loss | tee /tmp/raft-gateway-features.log
          grep -q '^test result: ok. 1 passed' /tmp/raft-gateway-features.log

      - name: heartbeat observations reject stale state and preserve bounded shutdown
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib cluster::server::heartbeat::tests -- --test-threads=1 | tee /tmp/fenced-health.log
          grep -q '^running 8 tests$' /tmp/fenced-health.log
          grep -q '^test result: ok. 8 passed' /tmp/fenced-health.log

      - name: catalog commands preserve durable state and quorum admission
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib cluster::meta_server::catalog_command_tests -- --test-threads=1 | tee /tmp/catalog-commands.log
          grep -q '^running 4 tests$' /tmp/catalog-commands.log
          grep -q '^test result: ok. 4 passed' /tmp/catalog-commands.log

      - name: api tls rejects plaintext and foreign clients before mutations
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::api_tls::tests::api_tls_rejects_plaintext_and_foreign_clients_before_mutations -- --exact --nocapture | tee /tmp/api-tls.log
          grep -q '^running 1 test$' /tmp/api-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/api-tls.log

      - name: api tls checks server identity and requires client certificates
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::api_tls::tests::api_tls_checks_server_identity_and_requires_client_certificates -- --exact --nocapture | tee /tmp/api-tls.log
          grep -q '^running 1 test$' /tmp/api-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/api-tls.log

      - name: api tls bounds stalled handshakes and server shutdown
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::api_tls::tests::api_tls_bounds_stalled_handshakes_and_server_shutdown -- --exact --nocapture | tee /tmp/api-tls.log
          grep -q '^running 1 test$' /tmp/api-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/api-tls.log

      - name: encrypted cli health and durable restart refuse plaintext downgrade
        run: |
          set -o pipefail
          cargo test --locked --all-features --test api_tls_processes encrypted_cli_health_and_durable_restart_refuse_plaintext_downgrade -- --exact --nocapture | tee /tmp/api-tls.log
          grep -q '^running 1 test$' /tmp/api-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/api-tls.log

      - name: peer TLS refuses incomplete configuration
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::peer_tls::configuration_tests::peer_tls_requires_complete_settings_and_a_supported_build -- --exact --nocapture | tee /tmp/peer-tls-config.log
          grep -q '^running 1 test$' /tmp/peer-tls-config.log
          grep -q '^test result: ok. 1 passed' /tmp/peer-tls-config.log

      - name: peer TLS configuration is refused when support is absent
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus,chunk-consensus --lib cluster::peer_tls::configuration_tests::peer_tls_requires_complete_settings_and_a_supported_build -- --exact --nocapture | tee /tmp/peer-tls-config.log
          grep -q '^running 1 test$' /tmp/peer-tls-config.log
          grep -q '^test result: ok. 1 passed' /tmp/peer-tls-config.log

      - name: peer TLS verifies identities and preserves frames
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::peer_tls::tests::peer_tls_requires_trusted_client_certificates_and_preserves_frames -- --exact --nocapture | tee /tmp/peer-tls.log
          grep -q '^running 1 test$' /tmp/peer-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/peer-tls.log

      - name: peer TLS validates server trust and blocks downgrade
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::peer_tls::tests::peer_tls_checks_server_address_trust_and_prevents_plaintext_downgrade -- --exact --nocapture | tee /tmp/peer-tls.log
          grep -q '^running 1 test$' /tmp/peer-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/peer-tls.log

      - name: peer TLS keeps stalled handshakes bounded
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::peer_tls::tests::peer_tls_stalled_handshakes_keep_delivery_and_shutdown_bounded -- --exact --nocapture | tee /tmp/peer-tls.log
          grep -q '^running 1 test$' /tmp/peer-tls.log
          grep -q '^test result: ok. 1 passed' /tmp/peer-tls.log

      - name: fanout reply deadline starts at send
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::client::pending_tests::fanout_reply_deadline_starts_when_request_is_sent -- --exact --nocapture | tee /tmp/fanout-deadline.log
          grep -q '^running 1 test$' /tmp/fanout-deadline.log
          grep -q '^test result: ok. 1 passed' /tmp/fanout-deadline.log

      - name: stalled star members share their reply wait budget
        run: |
          set -o pipefail
          cargo test --locked --all-features --test replica_state_transfer star_stalled_members_share_reply_wait_budget_without_replaying -- --exact --nocapture | tee /tmp/star-stalled.log
          grep -q '^running 1 test$' /tmp/star-stalled.log
          grep -q '^test result: ok. 1 passed' /tmp/star-stalled.log

      - name: health convergence survives temporary metadata quorum loss
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus,chunk-consensus --test network_chunk_consensus coupled_groups::health_convergence_wait_survives_temporary_metadata_quorum_loss -- --exact --nocapture | tee /tmp/health-convergence.log
          grep -q '^running 1 test$' /tmp/health-convergence.log
          grep -q '^test result: ok. 1 passed' /tmp/health-convergence.log

      - name: automatic health survives clock rollback and snapshot recovery
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::tests::automatic_health_survives_clock_rollback_and_snapshot_recovery -- --exact --nocapture | tee /tmp/health-clock-rollback.log
          grep -q 'test result: ok. 1 passed' /tmp/health-clock-rollback.log

      - name: chunk catalogs enter metadata read confirmation
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::tests::catalog_reads_queue_while_only_bootstrap_identity_bypasses_consensus -- --exact | tee /tmp/catalog-read-confirmation.log
          grep -q 'test result: ok. 1 passed' /tmp/catalog-read-confirmation.log
      - name: live catalog state and committed recovery
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::chunk_groups::tests::live_catalog_state_roundtrips_without_replacing_inventory_or_regressing_reports -- --exact --test-threads=1 | tee /tmp/live-catalog.log
          grep -q 'test result: ok. 1 passed' /tmp/live-catalog.log
          cargo test --locked --all-features --lib cluster::meta_consensus::tests::live_catalog_outcomes_apply_atomically_and_recover_after_checkpoint -- --exact --test-threads=1 | tee /tmp/live-catalog.log
          grep -q 'test result: ok. 1 passed' /tmp/live-catalog.log
          cargo test --locked --all-features --lib cluster::meta_server::chunk_group_tests::live_membership_health_restores_from_local_snapshot_and_streamed_checkpoint -- --exact | tee /tmp/live-catalog.log
          grep -q 'test result: ok. 1 passed' /tmp/live-catalog.log
      - name: retained chunk membership fences and joint health
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::chunk_membership -- --test-threads=1 | tee /tmp/chunk-membership-health.log
          grep -q 'test result: ok. 4 passed' /tmp/chunk-membership-health.log
          cargo test --locked --all-features --lib cluster::chunk_groups::tests::joint_health_requires_both_majorities_and_excludes_learners -- --exact | tee /tmp/chunk-membership-health.log
          grep -q 'test result: ok. 1 passed' /tmp/chunk-membership-health.log
      - name: membership replies stay inside trusted inventories
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_client::operation_deadline_tests::verified_metadata_membership_is_bound_to_the_trusted_inventory -- --exact | tee /tmp/membership-inventory.log
          grep -q 'test result: ok. 1 passed' /tmp/membership-inventory.log
          cargo test --locked --all-features --test chunk_catalog_routing verified_chunk_membership_is_bound_to_the_trusted_inventory -- --exact | tee /tmp/membership-inventory.log
          grep -q 'test result: ok. 1 passed' /tmp/membership-inventory.log

      - name: Membership confirmation failures remain uncertain mutations
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib committed_membership_confirmation_failure_never_authorizes_replay -- --test-threads=1 | tee /tmp/membership-confirmation.log
          grep -q 'test result: ok. 2 passed' /tmp/membership-confirmation.log

      - name: consensus diagnostics preserve late replies and uncertain mutations
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::consensus_inbox::progress_tests::consensus_diagnostics_preserve_late_replies_and_uncertain_mutations -- --exact --nocapture | tee /tmp/consensus-diagnostics.log
          grep -q 'test result: ok. 1 passed' /tmp/consensus-diagnostics.log
          cargo test --locked --all-features --lib cluster::consensus_inbox::progress_tests::completed_work_stalls_remain_visible_after_idle_and_shorter_phases -- --exact --nocapture | tee /tmp/consensus-diagnostics.log
          grep -q 'test result: ok. 1 passed' /tmp/consensus-diagnostics.log

      - name: metadata read leadership loss remains routable
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::read_failure_tests::metadata_lost_read_leadership_routes_without_masking_other_failures -- --exact --nocapture | tee /tmp/read-leadership-0.log
          grep -q 'test result: ok. 1 passed' /tmp/read-leadership-0.log

      - name: chunk read leadership loss remains routable
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::server::consensus::read_failure_tests::chunk_lost_read_leadership_routes_without_masking_other_failures -- --exact --nocapture | tee /tmp/read-leadership-1.log
          grep -q 'test result: ok. 1 passed' /tmp/read-leadership-1.log

      - name: metadata group stream retries transfer and recovers later mutations
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::metadata_group_stream_retries_transfer_and_recovers_later_mutations -- --exact --nocapture | tee /tmp/meta-group-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-group-stream.log

      - name: metadata group stream transfers more than 256 mib
        run: |
          set -o pipefail
          cargo test --locked --release --all-features --lib cluster::meta_checkpoint::tests::metadata_group_stream_transfers_more_than_256_mib -- --exact --ignored --nocapture | tee /tmp/meta-group-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-group-stream.log

      - name: metadata checkpoint stream preserves state and old envelopes
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::metadata_checkpoint_stream_preserves_state_and_old_envelopes -- --exact --nocapture | tee /tmp/meta-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-stream.log

      - name: metadata checkpoint stream refuses invalid headers and damage
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::metadata_checkpoint_stream_refuses_invalid_headers_and_damage -- --exact --nocapture | tee /tmp/meta-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-stream.log

      - name: dropping metadata capture unblocks its producer
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::dropping_metadata_capture_unblocks_its_producer -- --exact --nocapture | tee /tmp/meta-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-stream.log

      - name: metadata stream recovers more than 256 mib
        run: |
          set -o pipefail
          cargo test --locked --release --all-features --lib cluster::meta_checkpoint::tests::metadata_stream_recovers_more_than_256_mib -- --exact --ignored --nocapture | tee /tmp/meta-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-stream.log

      - name: background capture keeps both node policies writable and recovers suffix
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::consensus_checkpoint::tests::background_capture_keeps_both_node_policies_writable_and_recovers_suffix -- --exact --nocapture | tee /tmp/background-capture.log
          grep -q 'test result: ok. 1 passed' /tmp/background-capture.log

      - name: deferred chunk sealing preserves captured payload and statistics
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::chunk_checkpoint::tests::deferred_chunk_sealing_preserves_captured_payload_and_statistics -- --exact --nocapture | tee /tmp/deferred-sealing.log
          grep -q 'test result: ok. 1 passed' /tmp/deferred-sealing.log

      - name: deferred metadata sealing preserves captured roster and placements
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::tests::deferred_metadata_sealing_preserves_captured_roster_and_placements -- --exact --nocapture | tee /tmp/deferred-sealing.log
          grep -q 'test result: ok. 1 passed' /tmp/deferred-sealing.log

      - name: chunk group reply must name the requested placement
        run: |
          set -o pipefail
          cargo test --locked --all-features --test object_writer_connections chunk_route_reply_must_name_the_requested_placement -- --exact | tee /tmp/object-connections.log
          grep -q 'test result: ok. 1 passed' /tmp/object-connections.log

      - name: object writers preserve connection reuse and fallback compatibility
        run: |
          set -o pipefail
          cargo test --locked --all-features --test object_writer_connections -- --test-threads=1 | tee /tmp/object-connections.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' /tmp/object-connections.log

      - name: digest batching retains old-server fallback and absent-page results
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::client::pending_tests::raft_digest_batches_cache_unknown_verbs_and_preserve_absent_pages -- --exact | tee /tmp/digest-batching.log
          grep -q 'test result: ok. 1 passed' /tmp/digest-batching.log

      - name: digest batches survive data leader loss and refuse isolated reads
        run: |
          set -o pipefail
          cargo test --locked --all-features --test network_chunk_consensus conditional_digest_batches_replicate_ordered_page_outcomes -- --exact | tee /tmp/digest-batching.log
          grep -q 'test result: ok. 1 passed' /tmp/digest-batching.log

      - name: retention formats outcomes and preparation preserve state
        run: |
          set -o pipefail
          for test in \
            manifest_retention::tests::retention_wire_refuses_truncation_unknown_fields_and_conflicting_actions \
            cluster::meta_server::manifest_retention_tests::retention_outcomes_bound_capacity_preserve_versions_and_never_reuse_handles \
            cluster::meta_consensus::tests::retention_batch_preparation_restores_handles_before_committing_ordered_changes \
            cluster::meta_snapshot_file::tests::standalone_retention_journal_recovers_create_and_release
          do
            cargo test --locked --all-features --lib "$test" -- --exact | tee /tmp/manifest-retention.log
            grep -q 'test result: ok. 1 passed' /tmp/manifest-retention.log
          done

      - name: owned allocation formats and atomic outcomes recover
        run: |
          set -o pipefail
          for test in \
            staged_allocation::tests::staged_codec_and_ownership_reject_malformed_requests_and_foreign_pages \
            cluster::staged_allocation_commands::tests::staged_capacity_abort_and_publication_survive_binary_recovery_without_reusing_ids \
            cluster::staged_allocation_commands::tests::staging_journal_size_is_independent_of_existing_append_extents \
            cluster::staged_allocation_commands::tests::staging_journal_recovers_owned_allocation_and_atomic_publication \
            cluster::meta_consensus::tests::staging_batch_restores_reservations_and_objects_before_atomic_commit
