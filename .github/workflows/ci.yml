  chunk-consensus:
    name: network chunk consensus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install protocol build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool
      - name: chunk quorum reads leave the wal unchanged and refuse a minority
        run: |
          set -euo pipefail
          cargo test --locked --features chunk-consensus --test network_chunk_consensus chunk_quorum_reads_leave_the_wal_unchanged_and_refuse_a_minority -- --exact | tee /tmp/quorum-reads.log
          grep -q '^running 1 test$' /tmp/quorum-reads.log
          grep -q '^test result: ok. 1 passed' /tmp/quorum-reads.log
      - name: chunk processes commit binary outcomes survive leader loss and total restart
        run: |
          set -o pipefail
          cargo test --locked --features chunk-consensus --test network_chunk_consensus chunk_processes_commit_binary_outcomes_survive_leader_loss_and_total_restart -- --exact | tee /tmp/chunk-consensus.log
          grep -q '^running 1 test$' /tmp/chunk-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/chunk-consensus.log
      - name: chunk raft capacity refusal does not commit partial page state
        run: |
          set -o pipefail
          cargo test --locked --features chunk-consensus --test network_chunk_consensus chunk_raft_capacity_refusal_does_not_commit_partial_page_state -- --exact | tee /tmp/chunk-consensus.log
          grep -q '^running 1 test$' /tmp/chunk-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/chunk-consensus.log
      - name: chunk peer storage lock configuration and truncation fail closed
        run: |
          set -o pipefail
          cargo test --locked --features chunk-consensus --test network_chunk_consensus chunk_peer_storage_lock_configuration_and_truncation_fail_closed -- --exact | tee /tmp/chunk-consensus.log
          grep -q '^running 1 test$' /tmp/chunk-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/chunk-consensus.log
      - name: slow chunk peer packets do not prevent shutdown
        run: |
          set -o pipefail
          cargo test --locked --features chunk-consensus --test network_chunk_consensus slow_chunk_peer_packets_do_not_prevent_shutdown -- --exact | tee /tmp/chunk-consensus.log
          grep -q '^running 1 test$' /tmp/chunk-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/chunk-consensus.log
