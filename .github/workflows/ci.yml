          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::metadata_checkpoint_stream_preserves_state_and_old_envelopes -- --exact --nocapture | tee /tmp/meta-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-stream.log

      - name: metadata checkpoint stream refuses invalid headers and damage
