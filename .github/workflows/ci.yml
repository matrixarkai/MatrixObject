name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, so "it builds" means the same thing here and locally, and so
      # that denying warnings below cannot be broken by a compiler release
      # nobody in this repository chose.
      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build everything, warnings denied
        run: cargo build --all-targets --locked
        env:
          RUSTFLAGS: "-D warnings"

      # EVERY FEATURE, AND THIS IS NOT BELT-AND-BRACES. `net` -- the entire HTTP
      # surface, its wire format and its tests -- sits behind `http-server`, so
      # the step above never compiles a line of it. Two changes reached main with
      # the feature build broken before this step existed, each passing a green
      # check: the default build cannot see a feature-gated module at all, and
      # neither can `--all-targets`.
      - name: Build everything with every feature, warnings denied
        run: cargo build --all-targets --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Same reason, and it found two unresolved intra-doc links that had been in
      # `net` since it was written: a module nothing documents cannot have its
      # links checked.
      - name: Docs with every feature
        run: cargo doc --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  guards:
    name: format and rollback guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # raft-proto's build script shells out to protoc, which the runner does
      # not ship. Without this the build fails in 30 seconds with
      # "Could not find `protoc` installation".
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool iproute2 iptables util-linux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Each guard asserts that it actually RAN. `cargo test` reports success
      # when a filter matches nothing, so a step checking only the exit status
      # passes while testing nothing -- and `--exact` needs the full `tests::`
      # path or it matches nothing at all.
      - name: metadata read leadership loss remains routable
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_consensus::read_failure_tests::metadata_lost_read_leadership_routes_without_masking_other_failures -- --exact --nocapture | tee /tmp/read-leadership-0.log
          grep -q 'test result: ok. 1 passed' /tmp/read-leadership-0.log

      - name: chunk read leadership loss remains routable
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::server::consensus::read_failure_tests::chunk_lost_read_leadership_routes_without_masking_other_failures -- --exact --nocapture | tee /tmp/read-leadership-1.log
          grep -q 'test result: ok. 1 passed' /tmp/read-leadership-1.log

      - name: metadata group stream retries transfer and recovers later mutations
        run: |
          set -o pipefail
          cargo test --locked --all-features --lib cluster::meta_checkpoint::tests::metadata_group_stream_retries_transfer_and_recovers_later_mutations -- --exact --nocapture | tee /tmp/meta-group-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-group-stream.log

      - name: metadata group stream transfers more than 256 mib
        run: |
          set -o pipefail
          cargo test --locked --release --all-features --lib cluster::meta_checkpoint::tests::metadata_group_stream_transfers_more_than_256_mib -- --exact --ignored --nocapture | tee /tmp/meta-group-stream.log
          grep -q 'test result: ok. 1 passed' /tmp/meta-group-stream.log

      - name: metadata checkpoint stream preserves state and old envelopes
