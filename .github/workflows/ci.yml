          set -o pipefail
          cargo test --locked --lib \
            tests::an_object_record_owns_no_heap_before_or_after_a_snapshot_load -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::an_object_record_owns_no_heap_before_or_after_a_snapshot_load did not run"; exit 1; }

      # THESE TWO GUARD WHAT A FOLD AND A BATCHED READ COULD DROP, and both were added
      # because a plant against them left the whole suite at its recorded baseline. Each
      # counter helper has exactly one production caller, in a prepared batch mutation's
      # apply half, and every test driving those paths is in tools/known_failures.txt -- so
      # without these steps the only cover for that accounting is a failing test.
      - name: The folded replica counters advance every term they fold
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_folded_replica_counters_advance_every_term_they_fold -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_folded_replica_counters_advance_every_term_they_fold did not run"; exit 1; }

      # THE LEASE RULE IS ENFORCED AT FIVE SITES AND IS ONE FUNCTION NOW. The pair that
      # matters is the live gate and the snapshot DECODE gate: those two disagreeing means a
      # store writes a snapshot it cannot read back, so this guard round-trips both the lease
      # this store now writes and the one an older store would carry.
      # THESE THREE PIN A DECISION, not just a behaviour. When a control proof exists but
      # is not ready AND no endpoint is writable, two labels are true: the proof names the
      # proximate cause and the endpoint count names the consequence. The proof leads, and
      # the reason that answer was chosen over the other is recorded at the assertions
      # themselves. Flipping the precedence fails all three -- measured, by planting it.
      # THE RETIREMENT IS PINNED HERE. The bootstrap used to synthesise a second node of
      # kind "rootserver"; this asserts the roster it makes is one node, the metaserver, and
      # that journal REPLAY does not resurrect the retired one -- replay re-runs the same
      # mutator with the recorded arguments, so a record written before the retirement must
      # produce the post-retirement roster.
      # TWO INTEGRITY GUARDS, both added because a plant showed nothing was watching. A
      # RootSnapshot is encoded twice -- into the bytes on disk and into the material its
      # checksum covers -- and two page-health fields were in the first and in neither of the
      # fourteen forms of the second. Separately, dropping a format from the accepted list
      # left the entire suite green, so the read-old-forever promise was itself unguarded.
      - name: Every page health field the snapshot carries is covered by its checksum
        run: |
          set -o pipefail
          cargo test --locked --lib tests::every_page_health_field_the_snapshot_carries_is_covered_by_its_checksum -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::every_page_health_field_the_snapshot_carries_is_covered_by_its_checksum did not run"; exit 1; }

      - name: Every accepted snapshot checksum format still validates
        run: |
          set -o pipefail
          cargo test --locked --lib tests::every_accepted_snapshot_checksum_format_still_validates -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::every_accepted_snapshot_checksum_format_still_validates did not run"; exit 1; }

      - name: The embedded control plane is one node and replay does not resurrect the other
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::persistent_journal_replays_embedded_control_plane_bootstrap -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::persistent_journal_replays_embedded_control_plane_bootstrap did not run"; exit 1; }

      - name: The coverage status leads with the control proof
        run: |
          set -o pipefail
          cargo test --locked --lib tests::rootserver_raft_status_exposes_service_coverage -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::rootserver_raft_status_exposes_service_coverage did not run"; exit 1; }

      - name: The pageserver coverage status leads with the route control proof
        run: |
          set -o pipefail
          cargo test --locked --lib tests::rootserver_tracks_pageserver_service_coverage_for_write_routing -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::rootserver_tracks_pageserver_service_coverage_for_write_routing did not run"; exit 1; }

      - name: A health heartbeat moves the coverage status it reports
        run: |
          set -o pipefail
          cargo test --locked --lib tests::rootserver_health_heartbeats_update_service_coverage -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::rootserver_health_heartbeats_update_service_coverage did not run"; exit 1; }

      - name: The control plane leader lease is the metaserver's and old snapshots still load
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_control_plane_leader_lease_is_the_metaservers_and_old_snapshots_still_load -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_control_plane_leader_lease_is_the_metaservers_and_old_snapshots_still_load did not run"; exit 1; }

      - name: A replica behind on only a later page is refused check-in
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_replica_behind_on_only_a_later_page_is_refused_check_in -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_replica_behind_on_only_a_later_page_is_refused_check_in did not run"; exit 1; }

      - name: The root snapshot encoding is byte for byte what it was
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_root_snapshot_encoding_is_byte_for_byte_what_it_was -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_root_snapshot_encoding_is_byte_for_byte_what_it_was did not run"; exit 1; }

      - name: A rule the write path refuses is refused on the read path too
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::a_rule_the_write_path_refuses_is_refused_on_the_read_path_too -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_rule_the_write_path_refuses_is_refused_on_the_read_path_too did not run"; exit 1; }

      # THESE FOUR RUN A BINARY, NOT A LIBRARY. Every guard above is `--lib`, which
      # never links an integration test, so the kill test below would be COMPILED by
      # the build job and RUN by nothing -- which is the state a measurement rots in.
      #
      # `--test` names the one integration target, and the `running 1 test` check is
      # here as well as the `1 passed` one because `cargo test` exits 0 when a filter
      # matches nothing: without it, renaming the test would turn this step green.
      - name: Three replica processes keep the data when one is killed
        run: |
          set -o pipefail
          cargo test --locked --test a_replica_is_its_own_process \
            three_replica_processes_keep_the_data_when_one_is_killed -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::three_replica_processes_keep_the_data_when_one_is_killed did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::three_replica_processes_keep_the_data_when_one_is_killed did not pass"; exit 1; }

      - name: The two replica placements read back the same bytes
        run: |
          set -o pipefail
          cargo test --locked --test a_replica_is_its_own_process \
            the_two_placements_read_back_the_same_bytes -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::the_two_placements_read_back_the_same_bytes did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_two_placements_read_back_the_same_bytes did not pass"; exit 1; }

      - name: A replica frame with an unknown protocol stamp is refused by name
        run: |
          set -o pipefail
          cargo test --locked --test a_replica_is_its_own_process \
            a_frame_with_an_unknown_protocol_stamp_is_refused_by_name -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_frame_with_an_unknown_protocol_stamp_is_refused_by_name did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_frame_with_an_unknown_protocol_stamp_is_refused_by_name did not pass"; exit 1; }

      - name: A replica payload past the bound is refused before it is allocated
        run: |
          set -o pipefail
          cargo test --locked --test a_replica_is_its_own_process \
            a_payload_past_the_declared_bound_is_refused_before_it_is_allocated -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_payload_past_the_declared_bound_is_refused_before_it_is_allocated did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_payload_past_the_declared_bound_is_refused_before_it_is_allocated did not pass"; exit 1; }

      # THE SAME `--test` TREATMENT FOR THE WIDER SET. These four are in a second integration
      # target, and a target the guards job never names is a target CI compiles and runs
      # nothing from.
      - name: A majority is not all but one
        run: |
          set -o pipefail
          cargo test --locked --test replica_nodes_at_quorum_size \
            a_majority_is_not_all_but_one_and_two_majorities_always_overlap -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_majority_is_not_all_but_one_and_two_majorities_always_overlap did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_majority_is_not_all_but_one_and_two_majorities_always_overlap did not pass"; exit 1; }

      - name: A quorum pair that cannot read its writes is refused
        run: |
          set -o pipefail
          cargo test --locked --test replica_nodes_at_quorum_size \
            a_quorum_pair_that_cannot_read_its_writes_is_refused_by_name -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_quorum_pair_that_cannot_read_its_writes_is_refused_by_name did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_quorum_pair_that_cannot_read_its_writes_is_refused_by_name did not pass"; exit 1; }

      - name: The majority constructors carry a majority at every width
        run: |
          set -o pipefail
          cargo test --locked --test replica_nodes_at_quorum_size \
            the_majority_constructors_carry_a_majority_at_every_width -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::the_majority_constructors_carry_a_majority_at_every_width did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_majority_constructors_carry_a_majority_at_every_width did not pass"; exit 1; }

      - name: Five replica nodes serve at a quorum and refuse one below it
        run: |
          set -o pipefail
          cargo test --locked --test replica_nodes_at_quorum_size \
            five_replica_nodes_serve_at_exactly_a_quorum_and_refuse_one_below_it -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::five_replica_nodes_serve_at_exactly_a_quorum_and_refuse_one_below_it did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::five_replica_nodes_serve_at_exactly_a_quorum_and_refuse_one_below_it did not pass"; exit 1; }

      # THE CONTROL PLANE IN ITS OWN PROCESS. A third integration target, and a target the
      # guards job never names is a target CI compiles and runs nothing from. The last of
      # these is the one that decides it: four processes, the regime read two independent
      # ways, and placement stopping while reads do not.
      - name: A metaserver verb and a replica verb are never the same byte
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            a_metaserver_verb_and_a_replica_verb_are_never_the_same_byte -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_metaserver_verb_and_a_replica_verb_are_never_the_same_byte did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_metaserver_verb_and_a_replica_verb_are_never_the_same_byte did not pass"; exit 1; }

      - name: An empty endpoint list is the in-process control plane
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            an_empty_endpoint_list_is_the_control_plane_this_store_has_always_had -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::an_empty_endpoint_list_is_the_control_plane_this_store_has_always_had did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::an_empty_endpoint_list_is_the_control_plane_this_store_has_always_had did not pass"; exit 1; }

      - name: A metaserver endpoint with nothing behind it fails to open
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            an_endpoint_with_nothing_behind_it_fails_to_open -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::an_endpoint_with_nothing_behind_it_fails_to_open did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::an_endpoint_with_nothing_behind_it_fails_to_open did not pass"; exit 1; }

      - name: A replica frame sent to the metaserver is refused as an unknown verb
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            a_replica_frame_sent_to_the_metaserver_is_refused_as_an_unknown_verb -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_replica_frame_sent_to_the_metaserver_is_refused_as_an_unknown_verb did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_replica_frame_sent_to_the_metaserver_is_refused_as_an_unknown_verb did not pass"; exit 1; }

      - name: A metaserver client probes on every call rather than remembering
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            a_metaserver_client_probes_on_every_call_rather_than_remembering -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::a_metaserver_client_probes_on_every_call_rather_than_remembering did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::a_metaserver_client_probes_on_every_call_rather_than_remembering did not pass"; exit 1; }

      - name: The metaserver node stops placement and not reads
        run: |
          set -o pipefail
          cargo test --locked --test the_metaserver_is_its_own_node \
            the_metaserver_node_stops_placement_and_not_reads -- --exact \
            | tee /tmp/guard.log
          grep -q '^running 1 test$' /tmp/guard.log \
            || { echo "::error::the_metaserver_node_stops_placement_and_not_reads did not run"; exit 1; }
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_metaserver_node_stops_placement_and_not_reads did not pass"; exit 1; }

