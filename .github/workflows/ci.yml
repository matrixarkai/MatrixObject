  metadata-consensus:
    name: network metadata consensus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install protocol build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool
      - name: process quorum preserves outcomes across leader loss and total restart
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus --test network_metadata_consensus process_quorum_preserves_outcomes_across_leader_loss_and_total_restart -- --exact | tee /tmp/metadata-consensus.log
          grep -q '^running 1 test$' /tmp/metadata-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/metadata-consensus.log
      - name: a slow peer connection does not prevent shutdown
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus --test network_metadata_consensus a_slow_peer_connection_does_not_prevent_shutdown -- --exact | tee /tmp/metadata-consensus.log
          grep -q '^running 1 test$' /tmp/metadata-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/metadata-consensus.log
      - name: election noops checkpoint and replay without changing metadata
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus --test network_metadata_consensus election_noops_checkpoint_and_replay_without_changing_metadata -- --exact | tee /tmp/metadata-consensus.log
          grep -q '^running 1 test$' /tmp/metadata-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/metadata-consensus.log
      - name: peer storage refuses missing zeroed or reidentified history
