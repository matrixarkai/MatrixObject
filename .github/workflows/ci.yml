          set -o pipefail
          cargo test --locked --features metadata-consensus --test network_metadata_consensus peer_storage_refuses_missing_zeroed_or_reidentified_history -- --exact | tee /tmp/metadata-consensus.log
          grep -q '^running 1 test$' /tmp/metadata-consensus.log
          grep -q '^test result: ok. 1 passed' /tmp/metadata-consensus.log
      - name: typed not leader can route an unadmitted mutation
        run: |
          set -o pipefail
          cargo test --locked --features metadata-consensus --test metadata_catalog_routing typed_not_leader_can_route_an_unadmitted_mutation -- --exact | tee /tmp/metadata-routing.log
          grep -q '^running 1 test$' /tmp/metadata-routing.log
          grep -q '^test result: ok. 1 passed' /tmp/metadata-routing.log
