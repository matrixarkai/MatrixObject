      - name: The chunk identity is eight bytes and the wire and order are unchanged
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_chunk_identity_is_eight_bytes_and_the_wire_and_order_are_unchanged -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_chunk_identity_is_eight_bytes_and_the_wire_and_order_are_unchanged did not run"; exit 1; }

      - name: The published amplification table agrees with the metadata line
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::the_published_amplification_table_agrees_with_the_metadata_line -- --exact \
            | tee /tmp/guard.log
          grep -q '^test result: ok. 1 passed' /tmp/guard.log \
            || { echo "::error::the_published_amplification_table_agrees_with_the_metadata_line did not run"; exit 1; }

      - name: Every metadata leg is a line and the intercepts are named
        run: |
          set -o pipefail
          cargo test --locked --lib \
            tests::every_metadata_leg_is_a_line_and_the_intercepts_are_named -- --exact \
